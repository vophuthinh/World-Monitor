# Production-style run: web + API on one port.
#
#   docker compose up -d --build
#
# Set the public address people use to open the app (scheme + host + port), otherwise the API
# rejects requests with an unknown Host/Origin. Put it in a `.env` file next to this one:
#   WM_PUBLIC_ORIGIN=http://<server-ip>:8787
# The app has NO user authentication: expose it only on a trusted network or behind an
# authenticating reverse proxy.
# Keep container logs from growing without bound (json-file has no limit by default).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  worldmonitor:
    build: .
    image: worldmonitor:latest
    container_name: worldmonitor
    restart: unless-stopped
    # Resource guard rails: a leak or an abusive client can only hurt this container, not the host.
    # The Node heap cap sits below the container cap so the GC works before the kernel OOM-kills.
    mem_limit: ${WM_MEM_LIMIT:-1g}
    memswap_limit: ${WM_MEM_LIMIT:-1g}
    pids_limit: 256
    logging: *logging
    ports:
      - "${WM_PORT:-8787}:8787"
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      ALLOWED_ORIGINS: ${WM_PUBLIC_ORIGIN:-http://localhost:8787}
      # SearXNG runs as the `searxng` service below, reachable only inside the compose network.
      # Set SEARXNG_BASE_URL=off in `.env` to disable it.
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://searxng:8080}
      # Optional keys: pass through from the host `.env` when set.
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      RESTCOUNTRIES_API_KEY: ${RESTCOUNTRIES_API_KEY:-}
      NASA_FIRMS_API_KEY: ${NASA_FIRMS_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # HPT social-listening extensions (all optional).
      HPT_TELEGRAM_CHANNELS: ${HPT_TELEGRAM_CHANNELS:-}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
    volumes:
      - wm-cache:/app/.cache
    depends_on:
      - searxng
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Metasearch used for HPT social/forum listening. No published port: only `worldmonitor` can reach it.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: worldmonitor-searxng
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    logging: *logging
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Overrides server.secret_key from settings.yml. Generate one: openssl rand -hex 32
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      UWSGI_WORKERS: "2"
      UWSGI_THREADS: "2"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

volumes:
  wm-cache:
