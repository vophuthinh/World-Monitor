# Local-only SearXNG configuration for World Monitor (HPT Multi-Engine Social & Forum Listening)
# Bound strictly to 127.0.0.1:8888 via docker-compose.searxng.yml
use_default_settings: true

general:
  instance_name: "WorldMonitor Local SearXNG"
  enable_metrics: false

server:
  secret_key: "wm-local-loopback-only-searxng-secret"
  limiter: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "vi"
  formats:
    - html
    - json
    - rss

# Dedicated Google Programmable Search CX + exact-phrase engines; fuzzy/encyclopedia engines disabled
engines:
  - name: google cse
    engine: google_cse
    shortcut: goc
    CX: "c74fed0a86aff44a1"
    disabled: false
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: true
  - name: bing news
    engine: bing_news
    shortcut: bn
    disabled: true
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: true
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: true
  - name: yahoo
    engine: yahoo
    shortcut: yh
    disabled: true
  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: true
